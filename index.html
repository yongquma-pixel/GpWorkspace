const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36), money=n=>'¥'+(Number(n)||0).toLocaleString('zh-CN',{maximumFractionDigits:0}), pct=n=>(Number(n)||0).toFixed(1)+'%', num=v=>Number(v)||0;
function fresh(){return {dataVersion:1,funds:[],plans:[],settings:{sampleChoice:true,riskSettings:{}},activities:[],goal:null}}
function normalize(o){if(!o||typeof o!=='object'||!Array.isArray(o.funds)||!Array.isArray(o.plans))throw Error('数据结构不正确');return {dataVersion:1,funds:o.funds.map(f=>({id:String(f.id||uid()),name:String(f.name||'未命名基金'),currentAmount:Math.max(0,num(f.currentAmount)),recordedAnnualRate:f.recordedAnnualRate==null?'':num(f.recordedAnnualRate),riskType:['equity','fixed','other'].includes(f.riskType)?f.riskType:'auto',investedAmount:f.investedAmount==null?null:Math.max(0,num(f.investedAmount)),note:String(f.note||'')})),plans:o.plans.map(p=>({...defaultPlan(),...p,id:String(p.id||uid()),name:String(p.name||'未命名计划'),holdings:Array.isArray(p.holdings)?p.holdings.map(h=>({...defaultHolding(),...h,id:String(h.id||uid()),initialAmount:Math.max(0,num(h.initialAmount)),contribution:Math.max(0,num(h.contribution))})):[]})),settings:{...(o.settings||{}),riskSettings:(o.settings?.riskSettings&&typeof o.settings.riskSettings==='object'&&!Array.isArray(o.settings.riskSettings))?o.settings.riskSettings:{}},activities:Array.isArray(o.activities)?o.activities:[],goal:o.goal||null}}
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return fresh();const o=JSON.parse(raw);if(!o.dataVersion||o.dataVersion===1)return normalize(o);if(o.dataVersion>1){alert('本地数据版本较新，暂无法读取。数据保持原样。');return fresh()}return normalize(o)}catch(e){console.warn('本地数据读取失败',e);return fresh()}}
function save(){try{data.dataVersion=1;localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('保存失败：浏览器存储空间可能不足')}}
function logActivity(label){data.activities.unshift({label,at:new Date().toISOString()});data.activities=data.activities.slice(0,8)}
function toast(s){$('#toastRoot').innerHTML=`<div class="toast">${esc(s)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toastRoot').innerHTML='',2600)}
function defaultHolding(){return {id:uid(),fundId:null,name:'',initialAmount:0,contribution:100,frequency:'monthly',weekday:1,dayOfMonth:1,conservativeRate:4,neutralRate:8,optimisticRate:12,includePrincipal:true}}
function defaultPlan(){return {id:uid(),name:'新定投计划',horizonYears:10,contributionEndYears:10,mode:'principalAndContributions',annualIncrease:0,holdings:[]}}
function totalAssets(){return data.funds.reduce((s,f)=>s+num(f.currentAmount),0)}
function allColors(i){return COLORS[i%COLORS.length]}
function fmtFreq(h){return h.frequency==='tradingDay'?'交易日':h.frequency==='weekly'?'周'+['一','二','三','四','五','六','日'][Math.max(0,num(h.weekday)-1)]:h.frequency==='monthly'?(h.dayOfMonth==='last'?'每月末':`每月${h.dayOfMonth||1}日`):'每月'}
function paymentsPerYear(h){return h.frequency==='tradingDay'?260:h.frequency==='weekly'?52:h.frequency==='monthly'?12:12}
function annualContribution(h,year=0){let a=num(h.contribution)*paymentsPerYear(h);return a*Math.pow(1+num(h.annualIncrease||0)/100,year)}
function periodsPerYear(h){return h.frequency==='tradingDay'?260:h.frequency==='weekly'?52:12}
function simulateHolding(h,years,scenario='neutral',contributionEnd=null,overrideContribution=null,rateOverride=null){let periods=Math.max(1,Math.round(years*12));let end=contributionEnd==null?years:contributionEnd;let balance=h.includePrincipal===false?0:num(h.initialAmount), principal=balance, rows=[];let rate=rateOverride==null?num(h[scenario+'Rate']):num(rateOverride);let ppy=periodsPerYear(h);let annualR=rate/100;let periodRate=Math.pow(1+annualR,1/ppy)-1;let yearlyAdd=0;for(let m=1;m<=periods;m++){let yr=Math.floor((m-1)/12);let payments=m/12<=end?Math.max(0,Math.round(ppy/12)):0;let contrib=overrideContribution==null?num(h.contribution):overrideContribution;let add=payments*contrib*Math.pow(1+num(h.annualIncrease||0)/100,yr);if(m/12>end)add=0;yearlyAdd+=add;let nPeriods=Math.max(1,Math.round(ppy/12));for(let j=0;j<nPeriods;j++){let a=(m/12<=end&&j<payments)?add/Math.max(1,payments):0;balance=balance*(1+periodRate)+a;principal+=a}if(m%12===0||m===periods){rows.push({month:m,year:m/12,asset:balance,principal,profit:balance-principal,added:yearlyAdd});yearlyAdd=0}}return {asset:balance,principal,profit:balance-principal,rows}}
function aggregate(plan,years,scenario='neutral',contributionEnd=null){let hs=plan.holdings||[], results=hs.map(h=>simulateHolding(h,years,scenario,contributionEnd==null?Math.min(num(plan.contributionEndYears||years),years):contributionEnd));let rows=[];for(let i=0;i<Math.max(0,Math.ceil(years));i++){let asset=0,principal=0;results.forEach(r=>{let row=r.rows.find(x=>x.month===(i+1)*12)||r.rows[r.rows.length-1];if(row){asset+=row.asset;principal+=row.principal}});rows.push({year:i+1,asset,principal,profit:asset-principal})}return {asset:results.reduce((s,r)=>s+r.asset,0),principal:results.reduce((s,r)=>s+r.principal,0),profit:results.reduce((s,r)=>s+r.profit,0),funds:results.map((r,i)=>({name:hs[i].name,asset:r.asset,principal:r.principal,profit:r.profit})),rows}}
function calculatePortfolioProjection(p,y,s){return aggregate(p,y,s)}
function calculateScenario(plan,years,scenario){return calculatePortfolioProjection(plan,years,scenario)}
function calculateAnnualBreakdown(plan,years,scenario='neutral'){return aggregate(plan,years,scenario).rows}
function calculateSensitivity(plan,years){return [0,2,4,6,8,10,12,14].map(rate=>({rate,asset:aggregate({...plan,holdings:plan.holdings.map(h=>({...h,neutralRate:rate}))},years,'neutral').asset}))}
function calculateRequiredContribution(plan,target,years,scenario='neutral'){let zero=aggregate({...plan,holdings:plan.holdings.map(h=>({...h,contribution:0}))},years,scenario).asset;if(target<=zero)return 0;let lo=0,hi=1e7;for(let i=0;i<45;i++){let scale=(lo+hi)/2;let test=aggregate({...plan,holdings:plan.holdings.map(h=>({...h,contribution:num(h.contribution)*scale||scale}))},years,scenario).asset;if(test<target)lo=scale;else hi=scale}let weights=plan.holdings.reduce((s,h)=>s+num(h.contribution)*paymentsPerYear(h)/12,0);return hi*(weights||Math.max(1,plan.holdings.length))}
function calculateTimeToGoal(plan,target,maxYears=100){if(target<=0)return null;for(let y=.25;y<=maxYears;y+=.25)if(aggregate(plan,y,'neutral').asset>=target)return y;return null}
function fmtYears(y){if(!y)return '—';let m=Math.round(y*12);return `${Math.floor(m/12)}年${m%12?` ${m%12}个月`:''}`}
function donut(items,total,label='总资产'){let sum=items.reduce((s,x)=>s+x.value,0);if(!sum)return `<div class="empty"><div class="empty-icon">◌</div><div class="muted small">添加基金后显示资产结构</div></div>`;let r=54,c=2*Math.PI*r,offset=0;let paths=items.map((x,i)=>{let len=x.value/sum*c,seg=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${allColors(i)}" stroke-width="16" stroke-dasharray="${Math.max(0,len-2)} ${c-len+2}" stroke-dashoffset="${-offset}" transform="rotate(-90 70 70)" data-label="${esc(x.name)}" data-val="${x.value}" onclick="showDonutDetail(this)"/>`;offset+=len;return seg}).join('');return `<div class="donut-layout"><svg class="chart" viewBox="0 0 140 140" role="img" aria-label="${label}">${paths}<text x="70" y="66" text-anchor="middle" class="donut-center">${label}</text><text x="70" y="85" text-anchor="middle" class="donut-total">${money(total)}</text></svg><div>${items.map((x,i)=>`<div class="row between fund-row" style="gap:8px"><div class="row grow"><i class="dot" style="background:${allColors(i)}"></i><span class="fund-name small" title="${esc(x.name)}">${esc(x.name)}</span></div><span class="small amount">${pct(x.value/sum*100)}</span></div>`).join('')}</div></div>`}
function showDonutDetail(el){toast(`${el.dataset.label} · ${money(el.dataset.val)} · ${pct(num(el.dataset.val)/Math.max(1,totalAssets())*100)}`)}
function lineChart(series,labels,opts={}){let W=600,H=220,L=54,R=12,T=14,B=30,vals=series.flatMap(s=>s.values),max=Math.max(1,...vals),min=0,plotW=W-L-R,plotH=H-T-B;let pts=s=>s.values.map((v,i)=>`${L+i*(plotW/Math.max(1,s.values.length-1))},${T+plotH-(v-min)/(max-min)*plotH}`).join(' ');let grid=[0,.25,.5,.75,1].map(t=>`<line x1="${L}" x2="${W-R}" y1="${T+plotH*t}" y2="${T+plotH*t}" stroke="#edf0f2"/><text x="${L-7}" y="${T+plotH*t+4}" text-anchor="end" font-size="10" fill="#84909b">${shortMoney(max*(1-t))}</text>`).join('');let axis=labels.map((l,i)=>i%Math.max(1,Math.ceil(labels.length/5))===0||i===labels.length-1?`<text x="${L+i*plotW/Math.max(1,labels.length-1)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#84909b">${esc(l)}</text>`:'').join('');let lines=series.map((s,i)=>`<polyline fill="none" stroke="${s.color||allColors(i)}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" points="${pts(s)}"/>${s.values.map((v,j)=>`<circle cx="${L+j*plotW/Math.max(1,s.values.length-1)}" cy="${T+plotH-(v-min)/(max-min)*plotH}" r="3" fill="${s.color||allColors(i)}" onclick="toast('${esc(s.name)} · ${esc(labels[j])} · ${money(v)}')"/>`).join('')}`).join('');return `<svg class="chart" viewBox="0 0 ${W} ${H}" aria-label="资产增长图">${grid}${axis}${lines}</svg><div class="legend">${series.map((s,i)=>`<span><i class="dot" style="background:${s.color||allColors(i)}"></i>${esc(s.name)}</span>`).join('')}</div>`}
function shortMoney(n){if(n>=1e8)return (n/1e8).toFixed(1)+'亿';if(n>=1e4)return (n/1e4).toFixed(0)+'万';return Math.round(n).toString()}

function nav(){$('#sideNav').innerHTML=NAV.map(([id,icon,name])=>`<button class="${page===id?'active':''}" onclick="navigate('${id}')"><span class="side-icon">${icon}</span><span class="side-label">${name}</span></button>`).join('')}
function toggleSidebar(){let shell=$('.shell'),side=$('#sidebar'),backdrop=$('#sidebarBackdrop');if(window.matchMedia('(min-width:700px)').matches){shell.classList.toggle('collapsed')}else{side.classList.toggle('open');backdrop.classList.toggle('show',side.classList.contains('open'))}}

function handleSidebarSwipe(dx,dy,startX,target){if(window.matchMedia('(min-width:700px)').matches||Math.abs(dx)<72||Math.abs(dy)>56)return;if(target?.closest?.('input,textarea,select,button,svg,.risk-table-wrap,.modal,.custom-stress-control'))return;let side=$('#sidebar'),backdrop=$('#sidebarBackdrop'),isOpen=side.classList.contains('open');if(isOpen&&dx<0){closeSidebar();return}if(!isOpen&&(dx<0||(dx>0&&startX<34))){side.classList.add('open');backdrop.classList.add('show')}}
function initSidebarGestures(){let start=null;document.addEventListener('touchstart',e=>{if(!window.matchMedia('(min-width:700px)').matches&&e.touches?.length===1){let t=e.touches[0];start={x:t.clientX,y:t.clientY,target:e.target}}else start=null},{passive:true});document.addEventListener('touchend',e=>{if(!start||!e.changedTouches?.length){start=null;return}let t=e.changedTouches[0];handleSidebarSwipe(t.clientX-start.x,t.clientY-start.y,start.x,start.target);start=null},{passive:true});document.addEventListener('touchcancel',()=>{start=null},{passive:true})}

function homePage(){let total=totalAssets(),count=data.funds.length,contrib=data.plans.reduce((s,p)=>s+p.holdings.reduce((x,h)=>x+annualContribution(h)/12,0),0),invested=data.funds.reduce((s,f)=>s+(f.investedAmount==null?0:num(f.investedAmount)),0),recorded=total-invested;let dist=data.funds.map(f=>({name:f.name,value:num(f.currentAmount)}));let topPlans=data.plans.slice(0,2);let chosen=data.goal;let forecast=data.plans[0]&&data.plans[0].holdings.length?aggregate(data.plans[0],num(data.plans[0].horizonYears),'neutral').asset:0;return `<div class="grid home"><section class="home-intro"><div class="home-quote"><div class="home-quote-copy"><div class="home-quote-kicker">LONG-TERM INVESTING · DAILY NOTE</div><div class="home-quote-text">${esc(openingQuote)}</div></div><div class="home-quote-mark" aria-hidden="true">“</div></div></section><section class="card hero"><div class="eyebrow">当前总资产</div><div class="hero-value">${money(total)}</div><div class="muted">${count} 只基金${data.plans.length?` · 当前定投约 ${money(contrib)} / 月`:''}</div><div class="stat-row"><div class="stat"><span>当前总资产</span><strong>${money(total)}</strong></div><div class="stat"><span>累计投入</span><strong>${invested?money(invested):'未记录'}</strong></div><div class="stat"><span>当前记录收益</span><strong>${invested?money(recorded):'未记录'}</strong></div></div></section><section><div class="section-head"><h2>资产结构</h2><button onclick="navigate('funds')">查看基金 →</button></div><div class="card">${donut(dist,total)}</div></section><section><div class="section-head"><h2>基金资产</h2><button onclick="navigate('funds')">全部 →</button></div><div class="card">${count?data.funds.slice().sort((a,b)=>b.currentAmount-a.currentAmount).slice(0,5).map((f,i)=>`<div class="fund-row row"><i class="dot" style="background:${allColors(i)}"></i><div class="grow"><div class="fund-name">${esc(f.name)}</div><div class="subline">资产占比 ${pct(total?f.currentAmount/total*100:0)}</div></div><div class="amount">${money(f.currentAmount)}</div></div>`).join(' function goalSummary(goal,forecast){let progress=goal.amount?Math.min(100,forecast/goal.amount*100):0;return `<div class="goal-card"><svg class="goal-ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="#edf0f2" stroke-width="9"/><circle cx="50" cy="50" r="40" fill="none" stroke="#3578e5" stroke-width="9" stroke-linecap="round" stroke-dasharray="${progress*2.513} 251.3" transform="rotate(-90 50 50)"/><text x="50" y="54" text-anchor="middle" font-size="18" font-weight="700" fill="#17212b">${Math.round(progress)}%</text></svg><div><div class="label">目标金额</div><strong>${money(goal.amount)}</strong><div class="subline">当前计划中性情景 ${money(forecast)}</div></div></div>`}

function goalPlanner(p){return `<div class="input-grid"><div class="field"><label>目标金额</label><input type="number" min="0" id="goalAmount" value="${data.goal?.amount||1000000}" oninput="updatePlanner('${p.id}')"></div><div class="field"><label>投资期限（年）</label><input type="number" min=".25" step=".25" id="goalYears" value="${p.horizonYears}" oninput="updatePlanner('${p.id}')"></div><div class="field"><label>情景</label><select id="goalScenario" onchange="updatePlanner('${p.id}')"><option value="neutral">中性</option><option value="conservative">保守</option><option value="optimistic">乐观</option></select></div><div class="field"><label>现有本金</label><input id="goalPrincipal" value="计划中基金初始本金" disabled></div></div><div id="goalOutput" class="notice"></div><div class="hint" style="margin-top:8px">按各基金所设未来定投比例与各自收益率分别反推；显示单只基金所需金额合计及按当前计划比例分配的建议。</div>`}
function timePlanner(p){return `<div class="input-grid"><div class="field"><label>目标金额</label><input type="number" id="timeTarget" value="1000000" min="0" oninput="updateTime('${p.id}')"></div><div class="field"><label>未来月投入（按计划）</label><input value="${p.holdings.reduce((s,h)=>s+annualContribution(h)/12,0).toFixed(0)} 元/月" disabled></div></div><div id="timeOutput" class="notice"></div>`}

function riskClass(f){if(['equity','fixed','other'].includes(f.riskType))return f.riskType;let n=(f.name||'').toLowerCase();if(/债|固收|短债|纯债|利率债|信用债|货币|现金/.test(n))return 'fixed';if(/股票|指数|纳斯达克|标普|沪深|创业板|科创|中证|恒生|美股|科技|成长|红利|证券|消费/.test(n))return 'equity';return 'other'}
function riskShare(f){let t=totalAssets();return t>0?num(f.currentAmount)/t:0}
function riskClamp(v,def=-10){let n=Number(v);return Number.isFinite(n)?Math.max(-100,Math.min(0,n)):def}
function riskLoss(v){return '-'+money(Math.abs(v))}
function riskPct(v,d=1){return (Number(v)||0).toFixed(d)+'%'}
function riskDrop(id){return riskClamp(data.settings.riskSettings?.[id]??-10)}
function riskProfile(){let total=totalAssets(),funds=data.funds.slice().sort((a,b)=>num(b.currentAmount)-num(a.currentAmount)),equity=funds.filter(f=>riskClass(f)==='equity').reduce((s,f)=>s+num(f.currentAmount),0),fixed=funds.filter(f=>riskClass(f)==='fixed').reduce((s,f)=>s+num(f.currentAmount),0),shares=funds.map(riskShare),eqPct=total?equity/total*100:0,max=(shares[0]||0)*100,top2=shares.slice(0,2).reduce((a,b)=>a+b,0)*100,top3=shares.slice(0,3).reduce((a,b)=>a+b,0)*100,market=eqPct<10?'低':eqPct<25?'较低':eqPct<45?'中等':eqPct<65?'较高':'高',concentration=max<25?'低':max<40?'适中':max<55?'较高':'高',ranked=funds.map(f=>({f,loss:num(f.currentAmount)*Math.abs(riskDrop(f.id))/100})).sort((a,b)=>b.loss-a.loss),source=total>0?ranked[0]?.f||null:null,summary=!funds.length?'添加实盘基金后即可生成风险画像。':eqPct<10&&max>=50?'当前权益资产占比较低，整体市场波动暴露有限；资金主要集中于少数单只基金，需留意单一资产集中风险。':max>=50?`当前组合的主要风险来自${source?.name||'单一基金'}的仓位集中；单只基金占比较高时，其波动会更明显地传导至总资产。`:eqPct>=45?'组合权益仓位较高，市场整体波动对账户影响更明显。':max>=35?'组合存在一定单只基金集中度，同时权益资产带来额外波动。':'当前组合单只基金集中度相对分散，权益占比处于较低至中等区间。';return {total,funds,equity,fixed,eqPct,fixedPct:total?fixed/total*100:0,max,top2,top3,market,concentration,source,summary,ranked}}

function singleHTML(f,p){if(!f)return `<div class="risk-empty">请选择基金。</div>`;let loss=num(f.currentAmount)*Math.abs(singleShock)/100,impact=p.total?loss/p.total*100:0;return `<div class="risk-results" style="margin-top:16px"><div class="risk-result"><span class="label">${esc(f.name)} · 当前持仓</span><strong>${money(f.currentAmount)}</strong><div class="subline">组合仓位 ${riskPct(riskShare(f)*100)}</div></div><div class="risk-result loss"><span class="label">基金假设跌幅</span><strong>${singleShock}%</strong><div class="subline">情景模拟</div></div><div class="risk-result loss"><span class="label">该基金亏损</span><strong>${riskLoss(loss)}</strong><div class="subline">对总资产影响 -${riskPct(impact)}</div></div><div class="risk-result"><span class="label">组合剩余资产</span><strong>${money(p.total-loss)}</strong><div class="subline">其他基金保持不变</div></div></div>`}
function rankingHTML(p){let a=p.funds.map(f=>({f,d:riskDrop(f.id),loss:num(f.currentAmount)*Math.abs(riskDrop(f.id))/100,impact:p.total?num(f.currentAmount)*Math.abs(riskDrop(f.id))/p.total*100:0})).sort((x,y)=>y.loss-x.loss),max=Math.max(1,...a.map(x=>x.loss));return a.map((x,i)=>`<div class="risk-rank"><span class="risk-chip">${i+1}</span><div class="risk-rank-name"><strong title="${esc(x.f.name)}">${esc(x.f.name)}</strong><small>仓位 ${riskPct(riskShare(x.f)*100)} · 假设 ${x.d}%</small></div><div class="risk-bar-wrap"><div class="risk-bar"><i style="width:${x.loss/max*100}%"></i></div><small class="muted">-${riskPct(x.impact)} 组合影响</small></div><strong class="loss-text">${riskLoss(x.loss)}</strong></div>`).join('')||`<div class="risk-empty">暂无风险贡献。</div>`}
function matrixHTML(f,p){if(!f)return `<div class="risk-empty">暂无持仓基金。</div>`;return `<div class="subline" style="margin:0 0 10px">${esc(f.name)} · 当前仓位 ${riskPct(riskShare(f)*100)}</div><div class="risk-table-wrap"><table class="risk-table"><thead><tr><th>基金跌幅</th><th>基金亏损</th><th>组合影响</th><th>组合剩余资产</th></tr></thead><tbody>${[-5,-10,-15,-20,-30,-40,-50].map(d=>{let loss=num(f.currentAmount)*Math.abs(d)/100;return `<tr><td>${d}%</td><td>${riskLoss(loss)}</td><td>-${riskPct(p.total?loss/p.total*100:0)}</td><td>${money(p.total-loss)}</td></tr>`}).join('')}</tbody></table></div>`}
function barsHTML(p){let a=p.funds.map(f=>({f,loss:num(f.currentAmount)*Math.abs(riskDrop(f.id))/100,impact:p.total?num(f.currentAmount)*Math.abs(riskDrop(f.id))/p.total*100:0})).sort((x,y)=>y.loss-x.loss),max=Math.max(1,...a.map(x=>x.loss));return a.map(x=>`<div class="bar-item"><div class="bar-label"><span title="${esc(x.f.name)}">${esc(x.f.name)}</span><strong>-${riskPct(x.impact)}</strong></div><div class="risk-bar"><i style="width:${x.loss/max*100}%"></i></div></div>`).join('')||`<div class="risk-empty">暂无基金持仓。</div>`}

function refreshRiskLive(){if(page!=='risk')return;let p=riskProfile(),f=data.funds.find(x=>x.id===selectedRiskFund),el=id=>document.getElementById(id);if(el('riskProfileLive'))el('riskProfileLive').innerHTML=riskProfileCard();if(el('riskSourceLive'))el('riskSourceLive').innerHTML=riskSourceHTML(p);if(el('riskLive'))el('riskLive').innerHTML=singleHTML(f,p);if(el('portfolioLive'))el('portfolioLive').innerHTML=portfolioCards(p,portfolioShock);if(el('customSummary'))el('customSummary').innerHTML=customCards(p);document.querySelectorAll('.custom-stress-card').forEach(card=>{let f=data.funds.find(x=>x.id===card.dataset.fundId);if(!f)return;let loss=num(f.currentAmount)*Math.abs(riskDrop(f.id))/100,impact=p.total?loss/p.total*100:0;let l=card.querySelector('.stress-loss'),i=card.querySelector('.stress-impact'),r=card.querySelector('[data-stress-range]'),n=card.querySelector('[data-stress-number]');if(l)l.textContent=riskLoss(loss);if(i)i.textContent='-'+riskPct(impact);if(r&&document.activeElement!==r)r.value=riskDrop(f.id);if(n&&document.activeElement!==n)n.value=riskDrop(f.id)});let body=document.querySelector('.risk-table tbody');if(body)[...body.rows].forEach((row,i)=>{let x=p.funds[i];if(!x)return;let loss=num(x.currentAmount)*Math.abs(riskDrop(x.id))/100;if(row.cells[4])row.cells[4].textContent=riskLoss(loss);if(row.cells[5])row.cells[5].textContent='-'+riskPct(p.total?loss/p.total*100:0)});if(el('riskRanking'))el('riskRanking').innerHTML=rankingHTML(p);if(el('riskMatrix'))el('riskMatrix').innerHTML=matrixHTML(f,p);if(el('riskBars'))el('riskBars').innerHTML=barsHTML(p);if(el('riskCurve'))el('riskCurve').innerHTML=curveHTML(f,p);if(el('targetResult'))el('targetResult').innerHTML=targetHTML(data.funds.find(x=>x.id===el('targetFund')?.value)||f,p);if(el('reverseResult'))el('reverseResult').innerHTML=reverseHTML(f,p)}
function setSingleShock(v){singleShock=riskClamp(v);let s=document.getElementById('singleShockSlider'),n=document.getElementById('singleShockNumber');if(s&&document.activeElement!==s)s.value=singleShock;if(n&&document.activeElement!==n)n.value=singleShock;refreshRiskLive()}
function setPortfolioShock(v){portfolioShock=riskClamp(v);data.settings.portfolioShock=portfolioShock;save();let slider=document.getElementById('portfolioShockSlider'),number=document.getElementById('portfolioShockNumber');if(slider&&document.activeElement!==slider)slider.value=portfolioShock;if(number&&document.activeElement!==number)number.value=portfolioShock;let p=riskProfile(),el=document.getElementById('portfolioLive');if(el)el.innerHTML=portfolioCards(p,portfolioShock)}
function setCustomShock(id,v){if(!data.settings.riskSettings)data.settings.riskSettings={};data.settings.riskSettings[id]=riskClamp(v);save();refreshRiskLive()}
function initRiskSettings(){portfolioShock=riskClamp(data.settings.portfolioShock??-10)}
